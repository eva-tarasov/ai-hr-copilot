[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-hr-copilot"
version = "0.1.0"
description = "Local AI HR Copilot demo"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "openai>=2.54,<3",
    "pydantic>=2,<3",
    "pymupdf>=1.24,<2",
    "python-docx>=1.1,<2",
    "python-multipart>=0.0.10,<1",
    "sqlalchemy>=2,<3",
    "streamlit>=1.40,<2",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
